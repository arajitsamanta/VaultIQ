server:
  port: ${PORT:8080}

spring:
  application:
    name: vaultiq-api
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

vaultiq:
  openai:
    base-url: ${OPENAI_BASE_URL:http://localhost:11434/v1}
    api-key: ${OPENAI_API_KEY:ollama}
    chat-model: ${OPENAI_CHAT_MODEL:llama3.2}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:nomic-embed-text}
    temperature: ${OPENAI_TEMPERATURE:0.0}
  chroma:
    base-url: ${CHROMA_URL:http://localhost:8000}
    collection-name: ${CHROMA_COLLECTION:vaultiq}
    timeout-seconds: ${CHROMA_TIMEOUT_SECONDS:60}
  rag:
    max-results: ${RAG_MAX_RESULTS:4}
    min-score: ${RAG_MIN_SCORE:0.55}
    chunk-size-chars: ${RAG_CHUNK_SIZE:1500}
    chunk-overlap-chars: ${RAG_CHUNK_OVERLAP:150}
