spring:
  application:
    name: vaultiq-api-test

vaultiq:
  openai:
    base-url: http://localhost:11434/v1
    api-key: test-mock-key
    chat-model: llama3.2
    embedding-model: nomic-embed-text
    temperature: 0.0
  chroma:
    base-url: http://localhost:8000
    collection-name: vaultiq-test
    timeout-seconds: 5
  rag:
    max-results: 4
    min-score: 0.5
    chunk-size-chars: 1000
    chunk-overlap-chars: 100
