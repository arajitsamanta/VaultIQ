services:
  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: vaultiq-chromadb
    ports:

      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultiq-app
    ports:
      - "8080:8080"
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-llama3.2}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-nomic-embed-text}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.0}
      - CHROMA_URL=http://chromadb:8000
      - CHROMA_COLLECTION=vaultiq
      - RAG_MAX_RESULTS=4
      - RAG_MIN_SCORE=0.55
      - RAG_CHUNK_SIZE=1500
      - RAG_CHUNK_OVERLAP=150
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
